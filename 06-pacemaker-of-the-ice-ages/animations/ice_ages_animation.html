<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbits and Ice Ages</title>
<style>
:root { --bg:#07080d; --panel:#121522; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#ff6b81; --rule:#272c3d; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
.tabs button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
#stage { flex:1 1 560px; min-width:0; }
canvas { background:#04050a; border:1px solid var(--rule); border-radius:6px; width:100%; display:block; }
#side { flex:0 1 330px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:58%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
.row { display:flex; gap:6px; flex-wrap:wrap; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>
</head>

</header>

  const pr = a * (1 - ee); dot(cx + pr * Math.cos(vp * D2R), cy - pr * Math.sin(vp * D2R), 3, '#ff9aa9'); text('perihelion', cx + pr * Math.cos(vp * D2R) + 6, cy - pr * Math.sin(vp * D2R), '#ff9aa9', 11);
  const lamSun = ((L * 180 / Math.PI) + 180) % 360;
  const season = lamSun < 90 ? 'northern spring' : lamSun < 180 ? 'northern summer' : lamSun < 270 ? 'northern autumn' : 'northern winter';
  text(season, 20, H - 20, '#9aa0b4', 12);
  // insolation through the year
  const x0 = half + 40, x1 = W - 14, y0 = 20, y1 = H - 40, Y = q => y1 - q / 600 * (y1 - y0), X = l => x0 + l / 360 * (x1 - x0);
  ctx.strokeStyle = '#272c3d'; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  const k0 = FIT.t.indexOf(0);
  for (const [k, col, w] of [[k0, '#ffffff66', 1], [idx, '#ffb366', 2.2]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath();
    for (let l = 0; l <= 360; l += 3) { const q = insolation(FIT.ecc[k], FIT.obl[k], FIT.varpi[k], 65, l); l ? ctx.lineTo(X(l), Y(q)) : ctx.moveTo(X(l), Y(q)); }
    ctx.stroke(); ctx.lineWidth = 1;
  }
  ctx.strokeStyle = '#ff6b81'; ctx.beginPath(); ctx.moveTo(X(lamSun), y0); ctx.lineTo(X(lamSun), y1); ctx.stroke();
  [['spring', 0], ['summer', 90], ['autumn', 180], ['winter', 270]].forEach(([s, l]) => text(s, X(l) + 4, y1 + 16, '#9aa0b4', 11));
  text('65°N daily sunshine (W/m²)', x0 + 6, y0 + 14, '#9aa0b4', 11);
  for (let q = 100; q <= 500; q += 100) text(String(q), x0 - 4, Y(q) + 4, '#9aa0b4', 10, 'right');
  const tt = T(idx);
  document.getElementById('ro').textContent = `${tt === 0 ? 'today' : tt < 0 ? (-tt) + ' thousand years ago' : tt + ' thousand years from now'}\ne = ${e.toFixed(4)}   tilt = ${eps.toFixed(2)}°   ϖ = ${vp.toFixed(1)}°\nsummer-solstice sunshine at 65°N = ${FIT.ins[idx].toFixed(0)} W/m²\n(today: ${FIT.ins[k0].toFixed(0)} W/m²)`;
}
function sideMachine() {
  side.innerHTML = `<h2>Time machine</h2>
  <p>Top: summer sunshine at 65°N (the forcing). Middle: the ice-sheet model's state and ice volume. Bottom: the model's temperature (red) and the real EPICA ice-core temperature (white). Left: the northern ice cap grows and shrinks with the model's ice volume.</p>
  <div class="math">i →(f < i₀)→ g →(v > vmax)→ G →(f > i₁)→ i</div>
  <div class="ctl"><label>time <input id="tm" type="range" min="0" max="${N - 1}" step="1" value="${idx}"></label>
  <div class="row"><button id="now">Today</button><button id="pp">${play ? 'Pause' : 'Play through time'}</button></div></div><div class="readout" id="ro"></div>`;
  bindTime();
}
function drawMachine() {
  const gx = 14, gw = Math.min(W * 0.3, H * 0.6), x0 = gx + gw + 30, x1 = W - 14;
  const X = k => x0 + k / (N - 1) * (x1 - x0);
  const panels = [[16, H * 0.3, FIT.ins, 420, 570, 'sunshine 65°N (W/m²)', '#ffb366'], [H * 0.34, H * 0.62, FIT.ice, -0.5, 2.0, 'model ice volume', '#7fd1ff'], [H * 0.66, H - 30, null, -11, 6, 'temperature (°C)', '#ff6b81']];
  for (const [y0, y1, data, lo, hi, label, col] of panels) {
    const Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
    ctx.strokeStyle = '#272c3d'; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); text(label, x0 + 6, y0 + 13, '#9aa0b4', 11);
    if (data) {
      if (label.startsWith('model ice')) for (let k = 0; k < N; k++) if (FIT.state[k] === 2) { ctx.fillStyle = '#7fd1ff18'; ctx.fillRect(X(k), y0, (x1 - x0) / N + 0.5, y1 - y0); }
      ctx.strokeStyle = col; ctx.beginPath(); data.forEach((v, k) => k ? ctx.lineTo(X(k), Y(v)) : ctx.moveTo(X(k), Y(v))); ctx.stroke();
    } else {
      ctx.strokeStyle = '#ffffffaa'; ctx.beginPath(); let first = true;
      FIT.temp_obs.forEach((v, k) => { if (v === null || FIT.t[k] > 0) { first = true; return; } first ? ctx.moveTo(X(k), Y(v)) : ctx.lineTo(X(k), Y(v)); first = false; }); ctx.stroke();
      ctx.strokeStyle = col; ctx.beginPath(); FIT.ice.forEach((v, k) => { const tv = FIT.a + FIT.b * v; k ? ctx.lineTo(X(k), Y(tv)) : ctx.moveTo(X(k), Y(tv)); }); ctx.stroke();
    }
  }
  const k0 = FIT.t.indexOf(0);
  ctx.strokeStyle = '#ffffff55'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(k0), 16); ctx.lineTo(X(k0), H - 30); ctx.stroke(); ctx.setLineDash([]);
  text('today', X(k0) + 3, H - 16, '#9aa0b4', 10.5);
  for (const yr of [-800, -600, -400, -200]) { const k = FIT.t.indexOf(yr); if (k >= 0) text(yr === 0 ? '0' : (yr / 1000) + ' Myr', X(k), H - 16, '#9aa0b4', 10.5, 'center'); }
  ctx.strokeStyle = '#ff6b81'; ctx.beginPath(); ctx.moveTo(X(idx), 16); ctx.lineTo(X(idx), H - 30); ctx.stroke();
  // globe with ice cap
  const cx = gx + gw / 2, cy = H / 2, R = gw * 0.42;
  dot(cx, cy, R, '#1d4f8a');
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
  ctx.fillStyle = '#3d7a3a'; ctx.beginPath(); ctx.ellipse(cx - R * 0.3, cy - R * 0.35, R * 0.45, R * 0.3, -0.3, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + R * 0.35, cy - R * 0.4, R * 0.5, R * 0.28, 0.2, 0, 7); ctx.fill();
  const ice = Math.max(0, Math.min(1.6, FIT.ice[idx])), capR = R * (0.22 + 0.5 * ice / 1.6);
  ctx.fillStyle = '#eef6ff'; ctx.beginPath(); ctx.ellipse(cx, cy - R * 0.95, capR * 1.3, capR, 0, 0, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#ffffff55'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  const st = ['interglacial', 'glacial', 'full glacial'][FIT.state[idx]], tt = T(idx);
  text(st.toUpperCase(), cx, cy + R + 26, st === 'interglacial' ? '#9be38b' : '#bfe3ff', 14, 'center');
  document.getElementById('ro').textContent = `${tt === 0 ? 'today' : tt < 0 ? (-tt) + ' thousand years ago' : tt + ' thousand years from now'}\nstate: ${st}\nsunshine 65°N: ${FIT.ins[idx].toFixed(0)} W/m²\nmodel temperature: ${(FIT.a + FIT.b * FIT.ice[idx]).toFixed(1)} °C` + (FIT.temp_obs[idx] !== null && FIT.t[idx] <= 0 ? `\nEPICA temperature: ${FIT.temp_obs[idx].toFixed(1)} °C` : '');
}
const sides = { orbit: sideOrbit, machine: sideMachine };
document.getElementById('tabs').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); if (tab === 'machine' && idx === FIT.t.indexOf(0)) { idx = 0; play = true; } sides[tab](); };
function frame(now) {
  const dt = Math.max(0, Math.min(now - last, 60)) / 1000; last = now;
  if (play) { idx = Math.min(N - 1, idx + Math.max(1, Math.round(dt * 40))); if (idx >= N - 1) idx = 0; const s = document.getElementById('tm'); if (s) s.value = idx; }
  ctx.clearRect(0, 0, W, H);
  if (tab === 'orbit') drawOrbit(dt); else drawMachine();
  requestAnimationFrame(frame);
}
resize(); sideOrbit(); requestAnimationFrame(frame);
</script>
