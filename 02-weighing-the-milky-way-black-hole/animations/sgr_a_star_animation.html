const D2R = Math.PI / 180, AUYR = 4.740470463, C_KMS = 299792.458;

// ---------- the same model as the notebook ----------
function solveKepler(M, e) {
  let E = e > 0.8 ? Math.PI : M + e * Math.sin(M);
  for (let k = 0; k < 60; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
function orbit(p, t, R0) {            // returns [dRA, dDec, vz, X3d...]
  const i = p.i * D2R, O = p.Omega * D2R, w = p.omega * D2R, e = p.e, a = p.a;
  let M = 2 * Math.PI * (t - p.t_peri) / p.P; M = ((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const E = solveKepler(M, e);
  const X = Math.cos(E) - e, Y = Math.sqrt(1 - e * e) * Math.sin(E);
  const A = a * (Math.cos(w) * Math.cos(O) - Math.sin(w) * Math.sin(O) * Math.cos(i));
  const B = a * (Math.cos(w) * Math.sin(O) + Math.sin(w) * Math.cos(O) * Math.cos(i));
  const F = a * (-Math.sin(w) * Math.cos(O) - Math.cos(w) * Math.sin(O) * Math.cos(i));
  const G = a * (-Math.sin(w) * Math.sin(O) + Math.cos(w) * Math.cos(O) * Math.cos(i));
  const Ed = 2 * Math.PI / p.P / (1 - e * Math.cos(E));
  const Xd = -Math.sin(E) * Ed, Yd = Math.sqrt(1 - e * e) * Math.cos(E) * Ed;
  const Z = a * (Math.sin(w) * Math.sin(i) * X + Math.cos(w) * Math.sin(i) * Y);   // line of sight (mas)
  const vz = a * (R0 || 8) * Math.sin(i) * (Math.sin(w) * Xd + Math.cos(w) * Yd) * AUYR;
  const r = a * (1 - e * Math.cos(E));
  return { ra: B * X + G * Y, dec: A * X + F * Y, z: Z, vz: vz, r: r, E: E, M: M };
}
const S2 = FIT.s2;
const s2model = (t, p, R0) => {
  const o = orbit(p || S2, t, R0 || S2.R0);
  o.ra += S2.x0 + S2.vx * (t - 2009); o.dec += S2.y0 + S2.vy * (t - 2009); o.vz += S2.vz0; return o;
};

  ctx.stroke();
  for (const [d, v, e] of FIT.s2_rv) { ctx.strokeStyle = '#7fd1ff88'; ctx.beginPath(); ctx.moveTo(TX(d), VY(v - e)); ctx.lineTo(TX(d), VY(v + e)); ctx.stroke(); dot(TX(d), VY(v), 2.2, '#7fd1ff'); }
  if (t >= t0) dot(TX(t), VY(o.vz), 5, '#ffd36e');
  text('radial velocity (km/s)', x0 + 6, y0 + 12, '#9aa0b4', 11);
  const rAU = o.r * S2.R0, ra = (o.ra - S2.x0), de = (o.dec - S2.y0);
  const v3 = Math.sqrt(FIT.M_million * 1e6 * 39.478 * (2 / rAU - 1 / (S2.a * S2.R0))) * AUYR;
  document.getElementById('ro').textContent =
    `year            ${t.toFixed(3)}\ndistance to BH  ${rAU.toFixed(0)} AU\n3D speed        ${v3.toFixed(0)} km/s (${(100 * v3 / C_KMS).toFixed(2)}% c)\nradial velocity ${o.vz.toFixed(0)} km/s`;
}

// ---------- tab 2: 3D ----------
let yaw = 0.75, pitch = 0.45, dragging = false, lastXY = null;
cv.addEventListener('pointerdown', e => { dragging = true; lastXY = [e.clientX, e.clientY]; });
window.addEventListener('pointerup', () => dragging = false);
cv.addEventListener('pointermove', e => { if (!dragging || tab !== 'd3') return; yaw += (e.clientX - lastXY[0]) * 0.01; pitch += (e.clientY - lastXY[1]) * 0.01; lastXY = [e.clientX, e.clientY]; });
function side3d() {
  side.innerHTML = `<h2>The orbit in 3D</h2>
  <p><b>Drag</b> to rotate. Press "Our view" to look along the line of sight, exactly as the telescope does. The blue grid is the plane of the sky. The orbit is tilted by i = ${S2.i.toFixed(1)}°, so its projection is a different ellipse, and the black hole is <b>not</b> at the focus of the projected ellipse.</p>
  <div class="math">(x, y, z) = R_z(Ω) R_x(i) R_z(ω) · a (cos E − e, √(1−e²) sin E, 0)</div>
  <div class="ctl"><div class="row"><button id="view">Our view (line of sight)</button><button id="face">Face-on view of the orbit</button><button id="pp">${playing ? 'Pause' : 'Play'}</button></div>
  <label>speed <input id="sp" type="range" min="0.2" max="4" step="0.1" value="${speed}"></label></div><div class="readout" id="ro"></div>`;
  bind('sp', v => speed = +v); ppButton();
  document.getElementById('view').onclick = () => { yaw = 0; pitch = 0; };
  document.getElementById('face').onclick = () => { yaw = 0; pitch = -S2.i * D2R; };
}
function rot(v) {           // v = [east, north, toward observer]; camera rotation
  let [x, y, z] = v;
  const cy = Math.cos(yaw), sy = Math.sin(yaw); [x, z] = [cy * x + sy * z, -sy * x + cy * z];
  const cp = Math.cos(pitch), sp = Math.sin(pitch); [y, z] = [cp * y - sp * z, sp * y + cp * z];
  return [x, y, z];
}
function pos3(tt) { const o = orbit(S2, tt, S2.R0); return [-o.ra, o.dec, -o.z]; }   // screen x = east-left
function draw3d() {
  const sc = Math.min(W, H) / 330, cx = W / 2, cy = H / 2 + 60 * sc;
  const P = v => { const r = rot(v); return [cx + r[0] * sc, cy - r[1] * sc]; };
  ctx.strokeStyle = '#3a6cff33';
  for (let g = -150; g <= 150; g += 30) {
    let a = P([g, -150, 0]), b = P([g, 150, 0]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    a = P([-150, g, 0]); b = P([150, g, 0]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
  // line of sight
  ctx.strokeStyle = '#ffffff44'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(...P([0, 0, 0])); ctx.lineTo(...P([0, 0, 200])); ctx.stroke(); ctx.setLineDash([]);
  const q = P([0, 0, 200]); text('to Earth', q[0] + 6, q[1], '#9aa0b4', 11);
  // orbit, projection on sky plane
  ctx.strokeStyle = '#7fd1ff66'; ctx.beginPath();
  for (let k = 0; k <= 400; k++) { const v = pos3(S2.t_peri + k / 400 * S2.P); const p = P([v[0], v[1], 0]); k ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.stroke();
  ctx.strokeStyle = '#ffd36e'; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let k = 0; k <= 400; k++) { const p = P(pos3(S2.t_peri + k / 400 * S2.P)); k ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.stroke(); ctx.lineWidth = 1;
  const c = P([0, 0, 0]); blackHole(c[0], c[1], 0.9);
  const v = pos3(t), s = P(v), sp = P([v[0], v[1], 0]);
  ctx.strokeStyle = '#ffffff55'; ctx.beginPath(); ctx.moveTo(...s); ctx.lineTo(...sp); ctx.stroke();
  dot(sp[0], sp[1], 3, '#7fd1ff'); dot(s[0], s[1], 6, '#ffd36e');
  document.getElementById('ro').textContent = `year ${t.toFixed(2)}\nyellow: true orbit   blue: as seen on the sky\nline-of-sight offset ${(-v[2] * S2.R0).toFixed(0)} AU`;
}

// ---------- tab 3: cluster ----------
function sideCluster() {
  side.innerHTML = `<h2>The S-star cluster</h2>
  <p>Every star below moves on the orbit fitted <b>independently</b> to its own positions in the notebook. All of them turn around the same invisible point, and all obey Kepler's third law with the same a³/P².</p>
  <div class="ctl"><label>speed <input id="sp" type="range" min="0.5" max="40" step="0.5" value="${Math.max(speed, 5)}"></label>
  <div class="row"><button id="pp">${playing ? 'Pause' : 'Play'}</button></div></div><div class="readout" id="ro"></div>`;
  speed = Math.max(speed, 5); bind('sp', v => speed = +v); ppButton();
}
const COLS = ['#ffd36e', '#7fd1ff', '#ff9aa9', '#9be38b', '#c79bff', '#ffb366', '#6fe3d6', '#f0f0f0'];
function drawCluster() {
  const stars = Object.entries(FIT.stars);
  let rmax = 0; for (const [, p] of stars) rmax = Math.max(rmax, p.a * (1 + p.e));
  const sc = Math.min(W, H) / (2.15 * rmax), cx = W / 2, cy = H / 2;
  let lines = '';
  stars.forEach(([name, p], k) => {
    const col = COLS[k % COLS.length];
    ctx.strokeStyle = col + '55'; ctx.beginPath();
    for (let j = 0; j <= 300; j++) { const o = orbit(p, p.t_peri + j / 300 * p.P, 8); j ? ctx.lineTo(cx - o.ra * sc, cy - o.dec * sc) : ctx.moveTo(cx - o.ra * sc, cy - o.dec * sc); }
    ctx.stroke();
    const o = orbit(p, t, 8); dot(cx - o.ra * sc, cy - o.dec * sc, 4.5, col); text(name, cx - o.ra * sc + 7, cy - o.dec * sc - 5, col, 11.5);
    lines += `${name.padEnd(4)} P=${p.P.toFixed(1).padStart(6)} yr  a³/P²=${(p.a ** 3 / p.P ** 2).toFixed(0)}\n`;
  });
  blackHole(cx, cy, 0.8);
  document.getElementById('ro').textContent = `year ${t.toFixed(1)}\n` + lines;
}

// ---------- tab 4: weigh it yourself ----------
const WEIGH = { M: 3.0, R0: 7.0 };
function sideWeigh() {
  side.innerHTML = `<h2>Weigh it yourself</h2>
  <p>Change the mass and the distance. The <b>angular</b> size of the orbit, its shape and its orientation stay fixed. Kepler's third law then sets the period, and the distance converts mas/yr into km/s. Try to bring χ²/N close to 1!</p>
  <div class="math">P = √((a·R₀)³ / M)
v_z ∝ a · R₀ / P</div>
  <div class="ctl"><label>mass (million M☉) <input id="m" type="range" min="2" max="7" step="0.01" value="${WEIGH.M}"></label>
  <label>distance R₀ (kpc) <input id="r" type="range" min="6" max="10.5" step="0.01" value="${WEIGH.R0}"></label>
  <div class="row"><button id="best">Show the fitted answer</button></div></div><div class="readout" id="ro"></div>`;
  bind('m', v => WEIGH.M = +v); bind('r', v => WEIGH.R0 = +v);
  document.getElementById('best').onclick = () => { WEIGH.M = FIT.M_million; WEIGH.R0 = S2.R0; document.getElementById('m').value = WEIGH.M; document.getElementById('r').value = WEIGH.R0; };
}
function drawWeigh() {
  const P = Math.sqrt(Math.pow(S2.a * WEIGH.R0, 3) / (WEIGH.M * 1e6));
  const p = Object.assign({}, S2, { P: P });
  const model = tt => { const o = orbit(p, tt, WEIGH.R0); return { ra: o.ra + S2.x0, dec: o.dec + S2.y0, vz: o.vz + S2.vz0 }; };
  let chi = 0, n = 0;
  for (const [d, x, y, ex, ey] of FIT.s2_astrometry) { const o = model(d); chi += ((x - o.ra) / ex) ** 2 + ((y - o.dec) / ey) ** 2; n += 2; }
  for (const [d, v, e] of FIT.s2_rv) { chi += ((v - model(d).vz) / e) ** 2; n += 1; }
  const half = W / 2;
  // left: dec vs time, right: rv vs time
  const panels = [[10, half - 6, 'ΔDec (mas)', -40, 200, o => o.dec, FIT.s2_astrometry.map(r => [r[0], r[2], r[4]])],
                  [half + 6, W - 10, 'radial velocity (km/s)', -2200, 2200, o => o.vz, FIT.s2_rv]];
  for (const [xa, xb, lab, lo, hi, f, data] of panels) {
    const t0 = 1992, t1 = 2017, X = tt => xa + 30 + (tt - t0) / (t1 - t0) * (xb - xa - 30), Y = v => 30 + (hi - v) / (hi - lo) * (H - 70);
    ctx.strokeStyle = '#272c3d'; ctx.strokeRect(xa + 30, 30, xb - xa - 30, H - 70);
    text(lab, xa + 36, 46, '#9aa0b4', 12);
    for (let yr = 1995; yr <= 2015; yr += 5) text(String(yr), X(yr), H - 22, '#9aa0b4', 10, 'center');
    for (const [d, v, e] of data) { ctx.strokeStyle = '#7fd1ff77'; ctx.beginPath(); ctx.moveTo(X(d), Y(v - e)); ctx.lineTo(X(d), Y(v + e)); ctx.stroke(); dot(X(d), Y(v), 2.2, '#7fd1ff'); }
    ctx.strokeStyle = '#ffd36e'; ctx.beginPath();
    for (let k = 0; k <= 700; k++) { const tt = t0 + k / 700 * (t1 - t0); let yv = Y(f(model(tt))); yv = Math.max(20, Math.min(H - 30, yv)); k ? ctx.lineTo(X(tt), yv) : ctx.moveTo(X(tt), yv); }
    ctx.stroke();
  }
  document.getElementById('ro').textContent = `period P   = ${P.toFixed(2)} yr\nM / R0³    = ${(WEIGH.M * 1e6 / WEIGH.R0 ** 3).toFixed(0)} M☉/kpc³\nχ² / N     = ${(chi / n).toFixed(2)}\n(fitted: M = ${FIT.M_million.toFixed(2)}, R0 = ${S2.R0.toFixed(2)})`;
}

// ---------- loop ----------
const sides = { sky: sideSky, d3: side3d, cluster: sideCluster, weigh: sideWeigh };
const draws = { sky: drawSky, d3: draw3d, cluster: drawCluster, weigh: drawWeigh };
document.getElementById('tabs').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  if (tab !== 'cluster' && speed > 4) speed = 1;
  sides[tab]();
};
function frame(now) {
  const dt = Math.min(now - last, 60) / 1000; last = now;
  if (playing && tab !== 'weigh') {
    // slow down near pericentre so the swing is visible
    const o = orbit(S2, t, S2.R0), slow = tab === 'cluster' ? 1 : Math.min(1, Math.max(0.06, o.r / (S2.a * 0.6)));
    t += dt * speed * 0.8 * slow;
    if (tab !== 'cluster' && t > 2019) t = 1992;
  }
  ctx.clearRect(0, 0, W, H);
  draws[tab]();
  requestAnimationFrame(frame);
}
resize(); sideSky(); requestAnimationFrame(frame);
</script>
</body>
</html>
