<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepler's Laws, Animated</title>
<style>
:root { --bg:#0b0d14; --panel:#141824; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#ff6b81; --mars:#ff7a45; --earth:#4aa3ff; --sun:#ffc531; --area1:rgba(255,122,69,.30); --area2:rgba(74,163,255,.28); --rule:#2a3042; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3", "Helvetica Neue", Arial, sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
.tabs button, .ctl button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
.tabs button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
canvas { background:#070910; border:1px solid var(--rule); border-radius:6px; width:100%; touch-action:none; }
#stage { flex: 1 1 560px; min-width:0; }
#side { flex: 0 1 330px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family: "Source Code Pro", Menlo, monospace; font-size:12.8px; background:#0d1019; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; grid-template-columns: 1fr; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:58%; }
.readout { font-family:"Source Code Pro", Menlo, monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; }
.row { display:flex; gap:6px; flex-wrap:wrap; }
@media (max-width: 700px) { header h1 { font-size:15px; } #side { flex-basis:100%; } }
</style>
</head>

</header>

const D2R = Math.PI / 180, PREC = 50.29 / 3600 * D2R / 365.25;

// ---------- the same math as the notebook ----------
function solveKepler(M, e) {               // E - e sin E = M  (Newton)
  let E = M + e * Math.sin(M);
  for (let k = 0; k < 12; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
function inOrbit(model, a, e, eq, M) {      // (x, y), Sun at origin, x toward perihelion
  if (model === 'circle') return [a * Math.cos(M), a * Math.sin(M)];
  if (model === 'equant') {
    const dx = Math.cos(M), dy = Math.sin(M), wx = -(eq - e) * a;
    const wd = wx * dx, s = -wd + Math.sqrt(Math.max(wd * wd - wx * wx + a * a, 0));
    return [-eq * a + s * dx, s * dy];
  }
  const E = solveKepler(M, e);
  if (model === 'circle_area') return [a * (Math.cos(E) - e), a * Math.sin(E)];
  return [a * (Math.cos(E) - e), a * Math.sqrt(1 - e * e) * Math.sin(E)];
}
function helio(model, t, o, eq) {         // t in days since 1590 Jan 1 (Julian)
  const M = (o.L0 + 360 * t / o.P - o.varpi) * D2R;
  const [x, y] = inOrbit(model, o.a, o.e, eq || 0, M);
  const u = (o.varpi - (o.node || 0)) * D2R;
  const xn = Math.cos(u) * x - Math.sin(u) * y, yn = Math.sin(u) * x + Math.cos(u) * y;
  const cO = Math.cos((o.node || 0) * D2R), sO = Math.sin((o.node || 0) * D2R);
  const ci = Math.cos((o.i || 0) * D2R), si = Math.sin((o.i || 0) * D2R);
  return [cO * xn - sO * ci * yn, sO * xn + cO * ci * yn, si * yn];
}
function marsDeclination(t) {
  const E = helio('ellipse', t, FIT.earth), M = helio('ellipse', t, FIT.mars);
  const gx = M[0] - E[0], gy = M[1] - E[1], gz = M[2] - E[2];
  const lam = Math.atan2(gy, gx) + PREC * t, beta = Math.atan2(gz, Math.hypot(gx, gy));
  const eps = FIT.obliquity * D2R;
  return Math.asin(Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lam)) / D2R;
}

  const vel = Math.sqrt((2 / r - 1 / a)) * 2 * Math.PI * a / Math.sqrt(a * a * a) ; // relative units
  document.getElementById('ro').textContent =
    `t = ${(tDays % P).toFixed(0).padStart(4)} d of ${P.toFixed(2)} d\nM = ${(M / D2R).toFixed(1).padStart(6)}°   E = ${(E / D2R).toFixed(1).padStart(6)}°\ntrue anomaly ν = ${(((nu / D2R) + 360) % 360).toFixed(1).padStart(6)}°\nr = ${r.toFixed(4)} AU   (q = ${(a * (1 - e)).toFixed(3)}, Q = ${(a * (1 + e)).toFixed(3)})\narea of each slice = πab/${n} = ${area.toFixed(4)} AU²`;
}

// ---------- tab 2: triangulation ----------
const TRI = { pts: [], lastPair: null, nextT: 0 };
function sideTri() {
  side.innerHTML = `<h2>Kepler's triangulation</h2>
  <p>Mars returns to the same point of its orbit every <b>687 days</b>, but the Earth does not. Two sight lines, 687 days apart, cross exactly where Mars is. Repeat for many dates and the orbit draws itself.</p>
  <div class="math">E₁ + s₁ u₁ = E₂ + s₂ u₂
solve the 2×2 linear system for s₁, s₂
Mars = E₁ + s₁ u₁</div>
  <div class="ctl"><label>speed <input id="sp" type="range" min="2" max="120" step="1" value="${speed}"></label>
  <div class="row"><button id="clr">Clear points</button><button id="pp">${playing ? 'Pause' : 'Play'}</button></div></div>
  <div class="readout" id="ro"></div>`;
  bind('sp', v => speed = +v); document.getElementById('clr').onclick = () => { TRI.pts = []; };
  ppButton();
}
function drawTri() {
  const sc = Math.min(W, H) / 4.2, cx = W / 2, cy = H / 2, X = x => cx + x * sc, Y = y => cy - y * sc;
  const orb = (o, col) => { ctx.strokeStyle = col; ctx.beginPath(); for (let j = 0; j <= 200; j++) { const p = helio('ellipse', j / 200 * o.P, o); j ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])); } ctx.stroke(); };
  orb(FIT.earth, '#4aa3ff55'); orb(FIT.mars, '#ff7a4544');
  dot(X(0), Y(0), 8, css('--sun'));
  const P = FIT.mars.P, t2 = tDays, t1 = t2 - P;
  const E1 = helio('ellipse', t1, FIT.earth), E2 = helio('ellipse', t2, FIT.earth), M2 = helio('ellipse', t2, FIT.mars);
  const M1 = helio('ellipse', t1, FIT.mars);
  // sight lines (directions are what an observer actually measures)
  const line = (E, M, col) => { const dx = M[0] - E[0], dy = M[1] - E[1], L = Math.hypot(dx, dy); ctx.strokeStyle = col; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(X(E[0]), Y(E[1])); ctx.lineTo(X(E[0] + dx / L * 3.2), Y(E[1] + dy / L * 3.2)); ctx.stroke(); ctx.setLineDash([]); return [dx / L, dy / L]; };
  const u1 = line(E1, M1, '#7ee08a'), u2 = line(E2, M2, '#c79bff');
  // solve E1 + s1 u1 = E2 + s2 u2
  const det = u1[0] * (-u2[1]) - (-u2[0]) * u1[1];
  if (Math.abs(det) > 0.15) {
    const bx = E2[0] - E1[0], by = E2[1] - E1[1];
    const s1 = (bx * (-u2[1]) - (-u2[0]) * by) / det;
    const px = E1[0] + s1 * u1[0], py = E1[1] + s1 * u1[1];
    if (tDays > TRI.nextT) { TRI.pts.push([px, py]); TRI.nextT = tDays + 6; }
    dot(X(px), Y(py), 6, '#fff');
  }
  for (const p of TRI.pts) dot(X(p[0]), Y(p[1]), 2.2, css('--mars'));
  dot(X(E1[0]), Y(E1[1]), 6, '#7ee08a'); text('Earth, day t − 687', X(E1[0]) + 9, Y(E1[1]) + 4, '#7ee08a', 12);
  dot(X(E2[0]), Y(E2[1]), 6, '#c79bff'); text('Earth, day t', X(E2[0]) + 9, Y(E2[1]) + 4, '#c79bff', 12);
  document.getElementById('ro').textContent = `day t = ${tDays.toFixed(0)}\ntriangulated points: ${TRI.pts.length}`;
}

// ---------- tab 3: model vs Tycho ----------
function sideSky() {
  side.innerHTML = `<h2>The model against Tycho's sky</h2>
  <p>Orange dots: Tycho Brahe's <b>raw declinations</b> of Mars, 1582–1600. White curve: the ellipse model fitted in the notebook, computed live from the same equations (Earth's orbit + Mars's orbit + obliquity + precession).</p>
  <div class="math">δ = asin( sin β cos ε + cos β sin ε sin λ )</div>
  <p>The thin moving line is "now". Above it, the small orrery shows the Earth–Mars sight line that produces the declination.</p>
  <div class="ctl"><label>speed <input id="sp" type="range" min="2" max="120" step="1" value="${speed}"></label>
  <div class="row"><button id="pp">${playing ? 'Pause' : 'Play'}</button></div></div><div class="readout" id="ro"></div>`;
  bind('sp', v => speed = +v); ppButton();
}
let skyCurve = null;
function drawSky() {
  const t0 = FIT.tycho.t_min - 30, t1 = FIT.tycho.t_max + 30;
  if (!skyCurve) { skyCurve = []; for (let t = t0; t <= t1; t += 2) skyCurve.push([t, marsDeclination(t)]); }
  const top = H * 0.42, x0 = 50, x1 = W - 14, y0 = top + 10, y1 = H - 30;
  const X = t => x0 + (t - t0) / (t1 - t0) * (x1 - x0), Y = d => y0 + (30 - d) / 60 * (y1 - y0);
  ctx.strokeStyle = '#2a3042'; for (let d = -30; d <= 30; d += 10) { ctx.beginPath(); ctx.moveTo(x0, Y(d)); ctx.lineTo(x1, Y(d)); ctx.stroke(); text(d + '°', x0 - 6, Y(d) + 4, '#9aa0b4', 11, 'right'); }
  for (let yr = 1583; yr <= 1600; yr += 2) { const t = (yr - 1590) * 365.25; text(String(yr), X(t), y1 + 18, '#9aa0b4', 11, 'center'); }
  const obs = FIT.tycho.obs;
  for (const [t, d] of obs) dot(X(t), Y(d), 1.8, css('--mars'));
  ctx.strokeStyle = '#ffffffdd'; ctx.lineWidth = 1.2; ctx.beginPath();
  skyCurve.forEach(([t, d], k) => k ? ctx.lineTo(X(t), Y(d)) : ctx.moveTo(X(t), Y(d))); ctx.stroke(); ctx.lineWidth = 1;
  const tn = t0 + ((tDays * 2) % (t1 - t0));
  ctx.strokeStyle = '#ff6b81'; ctx.beginPath(); ctx.moveTo(X(tn), y0); ctx.lineTo(X(tn), y1); ctx.stroke();
  // mini orrery
  const sc = Math.min(top / 3.6, W / 7), cx = W / 2, cy = top / 2 + 4, OX = x => cx + x * sc, OY = y => cy - y * sc;
  dot(OX(0), OY(0), 6, css('--sun'));
  const E = helio('ellipse', tn, FIT.earth), M = helio('ellipse', tn, FIT.mars);
  ctx.strokeStyle = '#4aa3ff44'; ctx.beginPath(); ctx.arc(OX(0), OY(0), sc, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#ff7a4544'; ctx.beginPath(); ctx.arc(OX(0), OY(0), FIT.mars.a * sc, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#ffffff88'; ctx.beginPath(); ctx.moveTo(OX(E[0]), OY(E[1])); ctx.lineTo(OX(M[0]), OY(M[1])); ctx.stroke();
  dot(OX(E[0]), OY(E[1]), 5, css('--earth')); dot(OX(M[0]), OY(M[1]), 5, css('--mars'));
  const yr = 1590 + tn / 365.25;
  document.getElementById('ro').textContent = `year ≈ ${yr.toFixed(2)}\nmodel declination = ${marsDeclination(tn).toFixed(2)}°\nTycho points shown: ${obs.length}`;
}

// ---------- tab 4: law 3 ----------
function sideLaw3() {
  side.innerHTML = `<h2>Law 3 — the harmony of the worlds</h2>
  <p>Every planet obeys <b>T² ∝ a³</b>. Each planet below moves with the period predicted by the line fitted in the notebook: T = a<sup>${FIT.law3_slope.toFixed(4)}</sup> years (a in AU). Distances are shown on a square-root scale so that all nine bodies (Pluto included) fit.</p>
  <div class="math">log T = ${FIT.law3_slope.toFixed(4)} · log a
T² / a³ ≈ 1  (years, AU)</div>
  <div class="ctl"><label>speed <input id="sp" type="range" min="2" max="400" step="1" value="${speed}"></label>
  <div class="row"><button id="pp">${playing ? 'Pause' : 'Play'}</button></div></div><div class="readout" id="ro"></div>`;
  bind('sp', v => speed = +v); ppButton();
}
function drawLaw3() {
  const cx = W * 0.33, cy = H / 2, R = Math.min(W * 0.31, H * 0.46), amax = Math.sqrt(40);
  dot(cx, cy, 7, css('--sun'));
  const cols = ['#b9b9b9', '#f5d36b', '#4aa3ff', '#ff7a45', '#e0b383', '#f1d9a1', '#8fe3e8', '#5d7cff'];
  let lines = '';
  FIT.planets.forEach((p, k) => {
    const r = Math.sqrt(p.a_AU) / amax * R, T = Math.pow(p.a_AU, FIT.law3_slope);
    ctx.strokeStyle = '#ffffff22'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    const ang = 2 * Math.PI * (tDays / 365.25) / T;
    dot(cx + r * Math.cos(ang), cy - r * Math.sin(ang), 4.5, cols[k % cols.length]);
    text(p.name[0] + p.name.slice(1).toLowerCase(), cx + r * Math.cos(ang) + 7, cy - r * Math.sin(ang) - 6, cols[k % cols.length], 11);
    lines += `${p.name.padEnd(8)} a=${p.a_AU.toFixed(2).padStart(6)}  T=${p.period_years.toFixed(2).padStart(7)}  T²/a³=${(p.period_years ** 2 / p.a_AU ** 3).toFixed(3)}\n`;
  });
  // log-log panel
  const gx0 = W * 0.70, gx1 = W - 16, gy0 = 30, gy1 = H - 40;
  const lx = v => gx0 + (Math.log10(v) + 0.6) / 2.3 * (gx1 - gx0), ly = v => gy1 - (Math.log10(v) + 0.8) / 3.3 * (gy1 - gy0);
  ctx.strokeStyle = '#2a3042'; ctx.strokeRect(gx0, gy0, gx1 - gx0, gy1 - gy0);
  ctx.strokeStyle = '#ffffffaa'; ctx.beginPath(); ctx.moveTo(lx(0.3), ly(Math.pow(0.3, FIT.law3_slope))); ctx.lineTo(lx(45), ly(Math.pow(45, FIT.law3_slope))); ctx.stroke();
  FIT.planets.forEach((p, k) => dot(lx(p.a_AU), ly(p.period_years), 3.5, cols[k % cols.length]));
  text('log a', (gx0 + gx1) / 2, gy1 + 16, '#9aa0b4', 11, 'center'); text('log T', gx0 - 4, gy0 + 10, '#9aa0b4', 11, 'right');
  document.getElementById('ro').textContent = `elapsed: ${(tDays / 365.25).toFixed(1)} Earth years\n` + lines;
}

// ---------- loop ----------
function bind(id, f) { const el = document.getElementById(id); el.oninput = ev => f(ev.target.value); }
function ppButton() { const b = document.getElementById('pp'); if (b) b.onclick = () => { playing = !playing; b.textContent = playing ? 'Pause' : 'Play'; }; }
const sides = { law12: sideLaw12, tri: sideTri, sky: sideSky, law3: sideLaw3 };
const draws = { law12: drawLaw12, tri: drawTri, sky: drawSky, law3: drawLaw3 };
document.getElementById('tabs').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  if (tab === 'tri') { TRI.pts = []; TRI.nextT = 0; tDays = FIT.mars.P; }
  if (tab === 'law3') speed = 120; else if (speed > 120) speed = 25;
  sides[tab]();
};
function frame(now) {
  const dt = Math.min(now - last, 60) / 1000; last = now;
  if (playing) tDays += dt * speed * 10;
  ctx.clearRect(0, 0, W, H);
  draws[tab]();
  requestAnimationFrame(frame);
}
resize(); sideLaw12(); requestAnimationFrame(frame);
</script>
</body>
</html>
